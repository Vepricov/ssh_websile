# Clean only old entries in /tmp. systemd-tmpfiles also checks timestamps and
# skips mounts. Socket directories and service-private directories are excluded.
d /tmp 1777 root root 14d
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.Test-unix
x /tmp/systemd-private-*
x /tmp/snap-private-*
x /tmp/tmux-*
x /tmp/ssh-*
x /tmp/*.sock
x /tmp/.s.PGSQL*
