<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>BRAIn Lab — мой профиль</title>
    <link rel="stylesheet" href="access-form.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <main class="shell shell-compact">
        <header class="form-header">
            <div class="eyebrow"><span class="status-dot"></span>BRAIn Lab · Profile</div>
            <h1>Мой профиль</h1>
        </header>

        <form id="access-form" novalidate>
            <section class="form-section" aria-labelledby="identity-title">
                <div class="section-number">01</div>
                <div class="section-content">
                    <h2 id="identity-title">Основные данные</h2>
                    <div class="field-grid">
                        <label class="field field-wide">
                            <span>Имя и фамилия</span>
                            <input id="full-name" name="full_name" type="text" autocomplete="name" maxlength="120" placeholder="Иван Иванов" required>
                            <small>Как вас знают в лаборатории</small>
                        </label>
                    </div>

                    <label class="field field-wide">
                        <span>Рекомендатель</span>
                        <small>Кто пригласил вас и одобрит доступ. Можно выбрать нескольких — заявка уйдёт им и владельцу.</small>
                    </label>
                    <div class="server-grid" id="recommender-grid" role="group" aria-label="Рекомендатели"></div>
                    <p class="section-hint" id="recommender-empty" hidden>Список рекомендателей сейчас недоступен — можно оставить пустым: заявку получит владелец.</p>
                </div>
            </section>

            <div id="form-error" class="form-error" role="alert" hidden></div>

            <div class="submit-dock">
                <button id="submit-button" class="submit-button" type="submit">
                    <span>Сохранить профиль</span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </form>
    </main>
    <script src="access-form.js?v=recommender-picker-20261102"></script>
</body>
</html>
